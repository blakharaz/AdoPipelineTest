trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 8.0
            inputs:
              packageType: sdk
              version: 8.0.x
          - task: DotNetCoreCLI@2
            displayName: Restore dependencies
            inputs:
              command: restore
          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
