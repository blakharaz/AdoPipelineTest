parameters:
  # String parameter
  - name: projectName
    type: string
    default: 'MySampleProject'
    displayName: 'Project Name'

  # String parameter without default value
  - name: targetFile
    type: string
  
  # Boolean parameter
  - name: enableTests
    type: boolean
    default: true
    displayName: 'Enable Unit Tests'
  
  # Number parameter
  - name: timeoutMinutes
    type: number
    default: 30
    displayName: 'Timeout in Minutes'
  
  # String with allowed values
  - name: buildConfiguration
    type: string
    default: 'Release'
    values:
      - 'Debug'
      - 'Release'
      - 'CI'
    displayName: 'Build Configuration'
  
  # String with default value from environment
  - name: outputDirectory
    type: string
    default: '$(Build.ArtifactStagingDirectory)'
    displayName: 'Output Directory'
  
  # Object parameter (complex configuration)
  - name: buildSettings
    type: object
    default: {}
    displayName: 'Build Settings'

jobs:
  - job: BuildAndTest
    displayName: 'Build and Test Job'
    steps:
      
      - task: DotNetCoreCLI@2
        inputs:
          command: 'build'
          projects: '**/*.csproj'
          arguments: '--configuration Release'
        displayName: 'Build .NET Project'
      
      - task: DotNetCoreCLI@2
        inputs:
          command: 'test'
          projects: '**/*Tests.csproj'
          arguments: '--configuration Release'
        displayName: 'Run Unit Tests'
